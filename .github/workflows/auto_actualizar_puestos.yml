name: Actualización Automática Semanal de Puestos Ofertados

on:
  push:
    paths:
      - '2*.pdf'
      - '*pue_prov*.pdf'
      - 'telegram_*.pdf'
  schedule:
    # Lunes y Miércoles de 14:00 a 17:00 (hora peninsular española)
    # Ejecuta cada 10 minutos durante la franja oficial de publicación
    # (12:00 a 16:00 UTC cubre tanto horario de verano UTC+2 como de invierno UTC+1)
    - cron: '*/10 12-16 * * 1,3'
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'URL directa del nuevo PDF de puestos ofertados (opcional para forzar uno específico)'
        required: false
        default: ''

concurrency:
  group: auto-update-puestos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf

      - name: Ejecutar comprobación del bot (Telegram y Fuentes)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. Comprobar si el usuario envió un PDF por Telegram
          python bot_telegram.py

          # 2. Si se pasa una URL manual o se rastrean las fuentes
          if [ -n "${{ github.event.inputs.pdf_url }}" ]; then
            python actualizar_puestos.py "${{ github.event.inputs.pdf_url }}"
          else
            python bot_auto_actualizador.py
          fi

      - name: Guardar y publicar cambios en la web
        run: |
          git config --global user.name "Bot Puestos Conselleria"
          git config --global user.email "bot@destinos.docentes"
          git add data/ index.html destinos_web.zip
          if git diff --staged --quiet; then
            echo "No hay puestos nuevos que guardar."
          else
            git commit -m "Actualización automática de puestos ofertados [skip ci]"
            git push
          fi
